[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embalse"
version = "0.1.0"
description = "Private ML models for river-flow and reservoir-inflow forecasting, scored publicly in inflow-ledger"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "pandas>=2.2", "torch>=2.9"]

[project.optional-dependencies]
dev = ["pytest>=9"]

[tool.setuptools.packages.find]
include = ["embalse*"]
