name: Issue the hourly flow forecasts

# quantile_flow_hourly_v1_s0 for the three Russian River gauges, every hour at :25, when the hour's flow
# has reached USGS. The checkpoint lives under data/models/ on hapi's data branch. The weather and the flow are
# read from Open-Meteo and USGS at run time, so nothing else is needed from the branch. The forecasts are
# committed back to it.
on:
  schedule:
    - cron: '25 * * * *'  # every hour, so each observed hour has a forecast made the hour before
  # A second run in the same hour leaves the files already issued alone (issue_hourly.py).
  workflow_dispatch: {}

concurrency:
  group: issue-hourly
  cancel-in-progress: false

jobs:
  issue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CAUDAL_DATA: ${{ github.workspace }}/hapi-data/data
      HAPI_DATA: ${{ github.workspace }}/hapi-data/data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sotarolab/hapi
          ref: data
          path: hapi-data
          token: ${{ secrets.HAPI_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e . --extra-index-url https://download.pytorch.org/whl/cpu
      # v1 and the v2 blend side by side, so the two are scored live on the same hours; a product that fails
      # (a checkpoint not yet on the data branch) leaves the job red without stopping the other.
      - name: Issue each product
        run: |
          failed=0
          for model in quantile_flow_hourly_v1_s0 quantile_flow_hourly_v2_s0; do
            python scripts/issue_hourly.py --model "$model" --out "$HAPI_DATA" || failed=1
          done
          exit $failed
      # A gauge that failed leaves the job red; the gauges that issued are still committed.
      - name: Commit the forecasts
        if: ${{ !cancelled() }}
        working-directory: hapi-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecasts
          git diff --cached --quiet && exit 0
          git commit -q -m "issue the hourly flow products $(date -u +%Y-%m-%dT%HZ)"
          # hapi's archive job pushes to this branch every hour; try again if it lands between the pull and the push
          for attempt in 1 2 3; do
            git pull -q --rebase origin data && git push -q origin HEAD:data && exit 0
            sleep 10
          done
          exit 1
